# Cloudflare Workers configuration — https://developers.cloudflare.com/workers/wrangler/configuration/
name = "vibesai-openai"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Secrets (set with `npx wrangler secret put <NAME>` — never put real values
# in this file). How to grab each cookie from your browser: see COOKIES.md
#   VIBES_META_SESSION  — your vibes.ai meta_session cookie (server-side session)
#   AUTH_META_COOKIES   — optional auth.meta.com cookies for automatic re-login
#   VIBES_API_KEY       — optional API key clients must send as Bearer token
#
# Plain vars can go here directly:
[vars]
# CORS_ORIGIN = "*"
# VIBES_BASE_URL = "https://vibes.ai"

# Free plan is enough: this proxy streams responses and never stores state.
